<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 385" role="img" aria-labelledby="title desc">
  <title id="title">A right triangle scaled to the unit circle</title>
  <desc id="desc">A triangle with adjacent side a, opposite side b, and hypotenuse r is scaled by one over r. Its similar unit-circle triangle has adjacent side a over r equal to cosine theta, opposite side b over r equal to sine theta, and hypotenuse one.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker>
  </defs>
  <rect width="1120" height="385" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="21" fill="#334155">
    <text x="85" y="35" font-size="23" font-weight="bold">Any size, same angle</text>
    <path d="M90 300 L390 300 L390 75 Z" fill="#edf4f8" stroke="#475569" stroke-width="3"/>
    <path d="M90 300 H390" stroke="#226b9a" stroke-width="5"/>
    <path d="M390 300 V75" stroke="#ae4b33" stroke-width="5"/>
    <path d="M372 300 V282 H390" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M145 300 A55 55 0 0 0 134 267" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="152" y="281">θ</text>
    <text x="240" y="335" text-anchor="middle" fill="#226b9a">adjacent: a</text>
    <text x="405" y="195" fill="#ae4b33">opposite: b</text>
    <text x="220" y="170" text-anchor="middle" transform="rotate(-36.87 220 170)">hypotenuse: r</text>
    <path d="M515 250 H625" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="570" y="203" text-anchor="middle">divide every</text>
    <text x="570" y="229" text-anchor="middle">side by r</text>
    <text x="700" y="35" font-size="23" font-weight="bold">Hypotenuse 1</text>
    <path d="M700 100 A200 200 0 0 1 900 300" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="926" y="91" font-size="18" fill="#64748b">unit circle</text>
    <path d="M922 97 L849 159" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M700 300 V85 M680 300 H925" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M700 300 L860 300 L860 180 Z" fill="#edf4f8" stroke="#475569" stroke-width="3"/>
    <path d="M700 300 H860" stroke="#226b9a" stroke-width="5"/>
    <path d="M860 300 V180" stroke="#ae4b33" stroke-width="5"/>
    <path d="M846 300 V286 H860" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M750 300 A50 50 0 0 0 740 270" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="758" y="281">θ</text>
    <text x="780" y="335" text-anchor="middle" fill="#226b9a">a/r = cos θ</text>
    <text x="880" y="248" fill="#ae4b33">b/r = sin θ</text>
    <text x="765" y="226" text-anchor="middle">1</text>
    <circle cx="860" cy="180" r="4" fill="#334155"/>
    <text x="880" y="180">(a/r, b/r)</text>
    <text x="688" y="361" font-size="18">(0, 0)</text>
  </g>
</svg>
