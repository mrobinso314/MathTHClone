<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 525" role="img" aria-labelledby="title desc">
<title id="title">Roots as distances from the symmetry line</title><desc id="desc">The zeros -1 and 3 are each two horizontal units from x=1 for the parabola (x-1) squared minus 4.</desc>
