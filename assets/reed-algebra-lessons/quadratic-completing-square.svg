<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 650" role="img" aria-labelledby="title desc">
<title id="title">Completing a square with area tiles</title><desc id="desc">A square of area x squared and two strips of area 3x leave a 3 by 3 corner. Adding area 9 makes a square with side x+3.</desc>
<rect width="830" height="650" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="42" font-size="27" text-anchor="start" fill="#203346" font-weight="bold">Complete the square by filling the corner</text><text x="36" y="78" font-size="25" text-anchor="start" fill="#255f91" font-weight="normal">x² + 6x = x² + 3x + 3x</text><text x="50" y="134" font-size="24" text-anchor="start" fill="#203346" font-weight="bold">1. Split and rearrange</text><rect x="50" y="195" width="185" height="185" fill="#d5e8f5" stroke="#203346" stroke-width="2"/><text x="142.5" y="296.5" font-size="29" text-anchor="middle" fill="#203346" font-weight="normal">x²</text><rect x="235" y="195" width="85" height="185" fill="#cbece8" stroke="#203346" stroke-width="2"/><text x="277.5" y="296.5" font-size="29" text-anchor="middle" fill="#203346" font-weight="normal">3x</text><rect x="50" y="380" width="185" height="85" fill="#cbece8" stroke="#203346" stroke-width="2"/><text x="142.5" y="431.5" font-size="29" text-anchor="middle" fill="#203346" font-weight="normal">3x</text><rect x="235" y="380" width="85" height="85" fill="white" stroke="#b85b18" stroke-width="3" stroke-dasharray="7 5"/><text x="277.5" y="431.5" font-size="29" text-anchor="middle" fill="#b85b18" font-weight="normal">?</text><text x="142.5" y="178" font-size="24" text-anchor="middle" fill="#203346" font-weight="normal">x</text><text x="277.5" y="178" font-size="24" text-anchor="middle" fill="#203346" font-weight="normal">3</text><text x="35" y="295.5" font-size="24" text-anchor="end" fill="#203346" font-weight="normal">x</text><text x="35" y="430.5" font-size="24" text-anchor="end" fill="#203346" font-weight="normal">3</text><text x="185" y="505" font-size="24" text-anchor="middle" fill="#087e83" font-weight="normal">Side length: x + 3</text><text x="455" y="134" font-size="24" text-anchor="start" fill="#203346" font-weight="bold">2. Add the missing 9</text><rect x="455" y="195" width="185" height="185" fill="#d5e8f5" stroke="#203346" stroke-width="2"/><text x="547.5" y="296.5" font-size="29" text-anchor="middle" fill="#203346" font-weight="normal">x²</text><rect x="640" y="195" width="85" height="185" fill="#cbece8" stroke="#203346" stroke-width="2"/><text x="682.5" y="296.5" font-size="29" text-anchor="middle" fill="#203346" font-weight="normal">3x</text><rect x="455" y="380" width="185" height="85" fill="#cbece8" stroke="#203346" stroke-width="2"/><text x="547.5" y="431.5" font-size="29" text-anchor="middle" fill="#203346" font-weight="normal">3x</text><rect x="640" y="380" width="85" height="85" fill="#ffe2bd" stroke="#b85b18" stroke-width="3"/><text x="682.5" y="431.5" font-size="29" text-anchor="middle" fill="#b85b18" font-weight="normal">9</text><text x="547.5" y="178" font-size="24" text-anchor="middle" fill="#203346" font-weight="normal">x</text><text x="682.5" y="178" font-size="24" text-anchor="middle" fill="#203346" font-weight="normal">3</text><text x="440" y="295.5" font-size="24" text-anchor="end" fill="#203346" font-weight="normal">x</text><text x="440" y="430.5" font-size="24" text-anchor="end" fill="#203346" font-weight="normal">3</text><text x="590" y="505" font-size="24" text-anchor="middle" fill="#087e83" font-weight="normal">Side length: x + 3</text><text x="415" y="570" font-size="30" text-anchor="middle" fill="#255f91" font-weight="bold">x² + 6x + 9 = (x + 3)²</text><text x="415" y="610" font-size="25" text-anchor="middle" fill="#203346" font-weight="normal">Add 9 to both sides:  (x + 3)² = 7 + 9 = 16</text></g></svg>
